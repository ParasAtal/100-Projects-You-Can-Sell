<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="100 Projects You Can Sell — open-source software for real local businesses, by Paras Atal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0f"/>
      <stop offset="1" stop-color="#17110c"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d00"/>
      <stop offset=".55" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#ffc400"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#ff6a00" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <pattern id="hazard" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="11" height="22" fill="#ffc400"/>
      <rect x="11" width="11" height="22" fill="#111"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- hazard tape -->
  <rect x="0" y="392" width="1280" height="28" fill="url(#hazard)" opacity=".9" clip-path="url(#card)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <!-- eyebrow -->
    <rect x="72" y="62" width="300" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ff8a00" stroke-opacity=".6"/>
    <circle cx="94" cy="79" r="5" fill="#ff5a00"/>
    <text x="108" y="85" font-size="15" font-weight="700" letter-spacing="2.2" fill="#ffb15c">OPEN SOURCE · MIT · INDIA</text>

    <!-- title -->
    <text x="68" y="196" font-size="112" font-weight="900" letter-spacing="-4" fill="url(#fire)">100</text>
    <text x="286" y="196" font-size="72" font-weight="800" letter-spacing="-2" fill="#ffffff">Projects</text>
    <text x="70" y="272" font-size="72" font-weight="800" letter-spacing="-2" fill="#ffffff">You Can Sell.</text>

    <!-- subtitle -->
    <text x="72" y="326" font-size="23" fill="#c9c4bd">Real software for the factories, shops and clinics in your town.</text>
    <text x="72" y="358" font-size="23" fill="#c9c4bd">Full source code. Setup guide. Sales playbook. <tspan fill="#ffb15c" font-weight="700">Free.</tspan></text>

    <!-- counter card -->
    <g transform="translate(930 92)">
      <rect width="278" height="222" rx="20" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="28" y="44" font-size="14" font-weight="700" letter-spacing="2" fill="#8e8a84">SHIPPED</text>
      <text x="26" y="124" font-size="84" font-weight="900" letter-spacing="-3" fill="#ffffff">01<tspan font-size="36" fill="#6f6a64" font-weight="700"> / 100</tspan></text>
      <rect x="28" y="148" width="222" height="8" rx="4" fill="#ffffff" fill-opacity=".1"/>
      <rect x="28" y="148" width="14" height="8" rx="4" fill="url(#fire)"/>
      <text x="28" y="194" font-size="17" font-weight="600" fill="#c9c4bd">by Paras Atal · @i.amparas</text>
    </g>
  </g>
</svg>
